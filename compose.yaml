name: schoolz

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:8.8-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    ports:
      - "${REDIS_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-06-13T11-33-47Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT_INTERNAL: 6379
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:8088,http://127.0.0.1:4200,http://127.0.0.1:8088}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-school-erp-dev}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_TOKEN_PEPPER: ${AUTH_TOKEN_PEPPER}
      SCHOOLZ_PROVISIONING_KEY: ${SCHOOLZ_PROVISIONING_KEY:-}
      SCHOOLZ_PUBLIC_BASE_URL: ${SCHOOLZ_PUBLIC_BASE_URL:-http://localhost:8088}
      AUTH_SECURE_COOKIES: ${AUTH_SECURE_COOKIES:-false}
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-true}
      DEMO_EXPOSE_TOKENS: ${DEMO_EXPOSE_TOKENS:-true}
      DEMO_TENANT_SLUG: ${DEMO_TENANT_SLUG:-ecole-demo}
      DEMO_TENANT_NAME: ${DEMO_TENANT_NAME:-École Démonstration SchoolZ}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-admin@schoolz.ma}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD}
      DEMO_TEACHER_EMAIL: ${DEMO_TEACHER_EMAIL:-prof.math@schoolz.ma}
      DEMO_TEACHER_PASSWORD: ${DEMO_TEACHER_PASSWORD}
      DEMO_STUDENT_EMAIL: ${DEMO_STUDENT_EMAIL:-yasmine.eleve@schoolz.ma}
      DEMO_STUDENT_PASSWORD: ${DEMO_STUDENT_PASSWORD}
      PAYMENT_SANDBOX_WEBHOOK_SECRET: ${PAYMENT_SANDBOX_WEBHOOK_SECRET}
    ports:
      - "${BACKEND_HOST_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        BUILD_CONFIGURATION: ${FRONTEND_BUILD_CONFIGURATION:-production,demo}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  reverse-proxy:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    ports:
      - "${HTTP_PORT:-8088}:8080"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres18-data:
  redis-data:
  minio-data:
