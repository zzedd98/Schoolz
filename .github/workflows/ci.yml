name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile, test, verify modules and PostgreSQL migrations
        working-directory: backend
        run: ./mvnw --batch-mode verify

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint, format, test and build
        working-directory: frontend
        run: npm run check
      - name: Ensure the production bundle contains no demo credentials
        run: |
          ! rg "SchoolZ(Demo|Parent|Teacher|Student)2026" frontend/dist/frontend
      - name: Build the separately configured demo
        working-directory: frontend
        run: npm run build:demo
      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v5

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose model
        run: docker compose --env-file .env.example config --quiet
      - name: Validate production Compose model
        run: docker compose -f compose.prod.yaml --env-file .env.production.example config --quiet
      - name: Build application images
        run: docker compose --env-file .env.example build backend frontend
      - name: Build production application images
        run: docker compose -f compose.prod.yaml --env-file .env.production.example build backend frontend
