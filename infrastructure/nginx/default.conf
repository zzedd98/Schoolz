limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;

upstream schoolz_backend {
  server backend:8080;
  keepalive 32;
}

upstream schoolz_frontend {
  server frontend:8080;
  keepalive 16;
}

server {
  listen 8080;
  server_name _;
  server_tokens off;
  client_max_body_size 10m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header X-Permitted-Cross-Domain-Policies "none" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  location = /api/v1/auth/login {
    limit_req zone=login_limit burst=10 nodelay;
    proxy_pass http://schoolz_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $request_id;
  }

  location = /api/v1/auth/forgot-password {
    limit_req zone=login_limit burst=5 nodelay;
    proxy_pass http://schoolz_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $request_id;
  }

  location = /api/v1/public/admissions/sessions {
    limit_req zone=login_limit burst=10 nodelay;
    proxy_pass http://schoolz_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $request_id;
  }

  location ~ ^/(actuator|v3/api-docs|swagger-ui) {
    return 404;
  }

  # This operator-only endpoint is invoked from inside the backend container.
  # It must never be reachable through the public reverse proxy.
  location ^~ /api/v1/platform/provisioning/ {
    return 404;
  }

  location ^~ /api/ {
    limit_req zone=api_limit burst=60 nodelay;
    proxy_pass http://schoolz_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $request_id;
  }

  location = /swagger-ui.html {
    return 404;
  }

  location / {
    proxy_pass http://schoolz_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
